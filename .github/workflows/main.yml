name: OTF Testing

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Functional Test
    runs-on: ubuntu-latest

    env:
      URL: http://localhost

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build AUT
        run: docker build -t my-php-site .

      - name: Run AUT
        run: docker run -d -p 80:80 --name docker-aut my-php-site

      - name: Wait for AUT
        run: sleep 10

      - name: Check AUT
        run: curl http://localhost

      - name: Selenium Preparation
        run: docker run -d --network host --name firefox-standalone selenium/standalone-firefox:latest

      - name: Wait for Selenium Hub
        run: sh wait.sh

      - name: Check the Hub
        run: curl http://localhost:4444/ui

      - name: Install Selenium client
        run: pip install -U selenium

      - name: Run test
        run: python tests/hello_aut.py ${{ env.URL }}

      - name: Stop docker
        run: |
          docker stop docker-aut
          docker stop firefox-standalone
