name: OTF Testing

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Functional Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Build AUT (PHP Web)
      - name: Build AUT
        run: docker build -t my-php-site .

      # Run AUT
      - name: Run AUT
        run: docker run -d -p 80:80 --name docker-aut my-php-site

      - name: Wait for AUT
        run: sleep 10

      - name: Check AUT
        run: curl http://127.0.0.1

      # Run Selenium Standalone Firefox
      - name: Selenium Preparation
        run: |
          docker run -d \
            --network=host \
            -p 4444:4444 \
            --name firefox-standalone \
            selenium/standalone-firefox:latest

      # Wait until Selenium Hub ready
      - name: Wait for Selenium Hub
        run: sh wait.sh

      - name: Check the Hub
        run: curl http://localhost:4444/ui

      # Install Selenium client
      - name: Install Selenium client
        run: pip install -U selenium

      # Run Selenium Test
      - name: Run test
        run: python tests/hello_example.py

      # Stop all containers
      - name: Stop docker
        run: |
          docker stop docker-aut
          docker stop firefox-standalone
