name: OTF Testing

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Functional Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create isolated network
        run: docker network create --driver bridge isolated

      - name: Build AUT
        run: docker build -t my-php-site .

      - name: Run AUT
        run: docker run -d --network=isolated -p 80:80 --name docker-aut my-php-site

      - name: Selenium Preparation
        run: |
          docker run -d \
            --network=isolated \
            -p 4444:4444 \
            -p 7900:7900 \
            --shm-size="2g" \
            --name firefox-standalone \
            selenium/standalone-firefox:latest

      - name: Wait for Selenium Hub
        run: sh wait.sh

      - name: Check the Hub
        run: curl http://localhost:4444/ui

      - name: Install Selenium client
        run: pip install -U selenium

      - name: Run test
        run: python tests/hello_aut1.py http://docker-aut

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot
          path: screenshot.png

      - name: Stop docker
        run: |
          docker stop docker-aut firefox-standalone
